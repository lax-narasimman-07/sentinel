[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-cyber-mcp"
version = "1.0.0"
description = "OMEGA-CYBER-MCP — Agentic Security Research Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "OMEGA-CYBER"}]
dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "aiohttp>=3.9",
    "fastapi",
    "uvicorn[standard]>=0.30",
    "starlette>=0.37",
    "websockets",
    "click>=8.1",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]
browser = ["playwright"]
all = ["playwright", "pytest", "pytest-asyncio", "ruff", "mypy"]

[project.scripts]
omega = "omega.cli:main"

[tool.setuptools.packages.find]
include = ["omega*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
